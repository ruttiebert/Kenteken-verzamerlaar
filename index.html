<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankrijk Kenteken Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; }
        #sidebar { width: 350px; background-color: #ffffff; box-shadow: 4px 0 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 25px; z-index: 1000; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #2c3e50; }
        .subtitle { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 25px; }
        .stats-container { background-color: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 25px; border: 1px solid #e9ecef; }
        #stats-text { font-weight: 600; font-size: 1.1rem; color: #27ae60; margin-bottom: 5px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 10px 15px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #3498db; }
        button { padding: 10px 15px; border: none; border-radius: 6px; background-color: #3498db; color: white; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2980b9; }
        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .btn-secondary { background-color: #95a5a6; }
        .btn-secondary:hover { background-color: #7f8c8d; }
        .btn-danger { background-color: #e74c3c; margin-top: 15px; }
        .btn-danger:hover { background-color: #c0392b; }
        #map { flex: 1; background-color: #f8f9fa; }
        .dept-label { color: #2c3e50; font-family: sans-serif; font-size: 11px; font-weight: 700; text-align: center; pointer-events: none; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }
        
        /* Locatie status indicator */
        #location-status { font-size: 0.8rem; margin-top: 10px; color: #7f8c8d; display: flex; align-items: center; gap: 5px;}
        .dot { height: 8px; width: 8px; background-color: #ccc; border-radius: 50%; display: inline-block; }
        .dot.active { background-color: #3498db; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; padding: 15px; }
            #map { height: 60vh; }
            .actions { flex-direction: row; flex-wrap: wrap; }
            .actions button { flex: 1; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Frankrijk Kentekens</h1>
        <p class="subtitle">Klik op een departement om hem af te strepen.</p>

        <div class="stats-container">
            <div id="stats-text">0 / 0 gezien</div>
            <p style="font-size: 0.85rem; color: #7f8c8d;">van alle departementen afgevinkt</p>
            <div id="location-status"><span class="dot" id="loc-dot"></span> <span id="loc-text">Locatie zoeken...</span></div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Zoek op nummer of naam...">
            <button id="searchBtn">Zoek</button>
        </div>

        <div class="actions">
            <button id="exportBtn" class="btn-secondary">Exporteer Logboek</button>
            <button id="importBtn" class="btn-secondary">Importeer Logboek</button>
            <input type="file" id="importFile" style="display: none;" accept=".json">
            <button id="resetBtn" class="btn-danger">Reset Alles</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. GLOBALE VARIABELEN & SETUP ---
        const map = L.map('map', { zoomSnap: 0.5, minZoom: 5.5, maxZoom: 10 }).setView([46.4, 2.3], 6);
        let geojsonLayer;
        let labelLayerGroup = L.layerGroup().addTo(map);
        
        // Huidige data inladen of leeg starten
        let seenDepartments = JSON.parse(localStorage.getItem('fr_seen_plates')) || [];
        
        // Locatie variabelen
        let currentLat = null;
        let currentLng = null;
        let userMarker = null;

        // --- 2. LOCATIE TRACKING ---
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    
                    document.getElementById('loc-dot').classList.add('active');
                    document.getElementById('loc-text').innerText = "Locatie actief";

                    // Teken of verplaats de blauwe stip op de kaart
                    if (!userMarker) {
                        userMarker = L.circleMarker([currentLat, currentLng], {
                            color: '#fff', weight: 2, fillColor: '#3498db', fillOpacity: 1, radius: 7
                        }).addTo(map).bindTooltip("Jouw huidige locatie");
                    } else {
                        userMarker.setLatLng([currentLat, currentLng]);
                    }
                },
                (error) => {
                    document.getElementById('loc-text').innerText = "Locatie uitgeschakeld";
                    console.log("Locatie geweigerd/niet beschikbaar. App gebruikt alleen tijd.");
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        } else {
            document.getElementById('loc-text').innerText = "Locatie niet ondersteund";
        }

        // --- 3. HULPFUNCTIES VOOR DATA ---
        // Helper om te checken of een code gezien is (ondersteunt oude string format én nieuwe object format)
        function isCodeSeen(code) {
            return seenDepartments.some(item => typeof item === 'string' ? item === code : item.code === code);
        }

        // Styling definities
        function getStyle(feature) {
            const code = feature.properties.code;
            const isSeen = isCodeSeen(code);
            return {
                fillColor: isSeen ? '#2ecc71' : '#e0e0e0',
                weight: 1.5, opacity: 1, color: '#ffffff', fillOpacity: 0.85
            };
        }

        function updateStats() {
            if (!geojsonLayer) return;
            const total = geojsonLayer.getLayers().length;
            const seenCount = seenDepartments.length;
            const percentage = total > 0 ? Math.round((seenCount / total) * 100) : 0;
            document.getElementById('stats-text').innerText = `${seenCount} van de ${total} (${percentage}%)`;
        }

        // --- 4. KLIK & OPSLAAN LOGICA ---
        function toggleDepartment(code, layer) {
            // Zoek of hij er al in staat
            const index = seenDepartments.findIndex(item => typeof item === 'string' ? item === code : item.code === code);
            
            if (index > -1) {
                // Al gezien? Verwijder hem dan.
                seenDepartments.splice(index, 1); 
            } else {
                // Nieuw? Voeg toe met tijd en locatie (als beschikbaar)
                const newEntry = {
                    code: code,
                    timestamp: new Date().toISOString() // Slaat tijd op als bijv: "2026-06-03T10:15:00.000Z"
                };
                if (currentLat !== null && currentLng !== null) {
                    newEntry.lat = currentLat;
                    newEntry.lng = currentLng;
                }
                seenDepartments.push(newEntry);
            }
            
            localStorage.setItem('fr_seen_plates', JSON.stringify(seenDepartments));
            geojsonLayer.resetStyle(layer);
            updateStats();
        }

        // --- 5. KAART OPBOUWEN ---
        function onEachFeature(feature, layer) {
            layer.bindTooltip(`<strong>${feature.properties.code}</strong> - ${feature.properties.nom}`, { sticky: true });

            layer.on({
                mouseover: function (e) {
                    const l = e.target;
                    l.setStyle({ weight: 3, color: '#3498db', fillOpacity: 0.9 });
                    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) l.bringToFront();
                    labelLayerGroup.bringToFront();
                },
                mouseout: function (e) { geojsonLayer.resetStyle(e.target); },
                click: function (e) { toggleDepartment(feature.properties.code, e.target); }
            });

            const center = layer.getBounds().getCenter();
            const labelMarker = L.marker(center, {
                icon: L.divIcon({ className: 'dept-label', html: `<span>${feature.properties.code}</span>`, iconSize: [20, 20], iconAnchor: [10, 10] }),
                interactive: false
            });
            labelLayerGroup.addLayer(labelMarker);
        }

        fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
            .then(response => response.json())
            .then(data => {
                geojsonLayer = L.geoJSON(data, { style: getStyle, onEachFeature: onEachFeature }).addTo(map);
                updateStats();
            })
            .catch(error => console.error('Fout bij laden kaartgegevens:', error));

        // --- 6. ZOEKFUNCTIE ---
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query || !geojsonLayer) return;
            let foundLayer = null;
            geojsonLayer.eachLayer(layer => {
                const code = layer.feature.properties.code.toLowerCase();
                const nom = layer.feature.properties.nom.toLowerCase();
                if (code === query || nom === query || nom.includes(query)) foundLayer = layer;
            });

            if (foundLayer) {
                map.fitBounds(foundLayer.getBounds(), { maxZoom: 8, padding: [40, 40] });
                foundLayer.setStyle({ color: '#e74c3c', weight: 4 });
                setTimeout(() => geojsonLayer.resetStyle(foundLayer), 2000);
            } else {
                alert('Departement niet gevonden.');
            }
        }
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') performSearch(); });

        // --- 7. EXPORT / IMPORT / RESET ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(seenDepartments, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            // Genereer een bestandsnaam met de huidige datum
            const dateString = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("download", `kenteken_logboek_${dateString}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());

        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (Array.isArray(importedData)) {
                        seenDepartments = importedData;
                        localStorage.setItem('fr_seen_plates', JSON.stringify(seenDepartments));
                        geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
                        updateStats();
                        alert('Logboek succesvol geladen!');
                    } else { alert('Fout: Bestand heeft niet het juiste formaat.'); }
                } catch (err) { alert('Fout bij het lezen van het bestand.'); }
            };
            reader.readAsText(file);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Weet je zeker dat je alles wilt wissen?')) {
                seenDepartments = [];
                localStorage.removeItem('fr_seen_plates');
                geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
                updateStats();
            }
        });
    </script>
</body>
</html>
