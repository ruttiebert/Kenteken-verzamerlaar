<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankrijk Kenteken Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; overflow: hidden; position: relative; }
        
        /* Sidebar Styling */
        #sidebar { width: 350px; background-color: #ffffff; box-shadow: 4px 0 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 25px; z-index: 1000; }
        h1 { font-size: 1.4rem; margin-bottom: 2px; color: #2c3e50; }
        .subtitle { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 15px; }
        
        .stats-container { background-color: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        #stats-text { font-weight: 600; font-size: 1.05rem; color: #27ae60; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem; outline: none; }
        input[type="text"]:focus { border-color: #3498db; }
        
        /* Knoppen Layout */
        button { padding: 9px 12px; border: none; border-radius: 6px; background-color: #3498db; color: white; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2980b9; }
        
        .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn-share { background-color: #2ecc71; font-size: 1rem; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-share:hover { background-color: #27ae60; }
        
        .sub-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-secondary { background-color: #95a5a6; font-size: 0.85rem; padding: 9px; width: 100%; }
        .btn-secondary:hover { background-color: #7f8c8d; }
        .btn-danger { background-color: #e74c3c; font-size: 0.85rem; padding: 9px; width: 100%; }
        .btn-danger:hover { background-color: #c0392b; }
        
        /* Kaart element */
        #map-container { flex: 1; position: relative; height: 100%; background-color: #f8f9fa; z-index: 1; }
        #map { width: 100%; height: 100%; }
        
        .dept-label { color: #2c3e50; font-family: sans-serif; font-size: 10px; font-weight: 700; text-align: center; pointer-events: none; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
            .subtitle { margin-bottom: 10px; }
            .stats-container { margin-bottom: 10px; padding: 10px; }
            .search-box { margin-bottom: 10px; }
            #map-container { flex: 1; height: calc(100vh - 225px); }
            .actions { margin-top: 5px; gap: 6px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Frankrijk Kentekens</h1>
        <p class="subtitle">Klik op een departement om hem af te strepen.</p>

        <div class="stats-container">
            <div id="stats-text">0 / 0 gezien</div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Nummer of naam...">
            <button id="searchBtn">Zoek</button>
        </div>

        <div class="actions">
            <button id="shareBtn" class="btn-share">📤 Deel Voortgang</button>
            <div class="sub-actions-grid">
                <button id="exportBtn" class="btn-secondary">Exporteer</button>
                <button id="importBtn" class="btn-secondary">Importeer</button>
            </div>
            <button id="resetBtn" class="btn-danger">Reset Alles</button>
            <input type="file" id="importFile" style="display: none;" accept=".json">
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // --- GLOBALE VARIABELEN ---
        const map = L.map('map', { zoomSnap: 0.1, minZoom: 4, maxZoom: 10 }).setView([46.4, 2.3], 5.8);
        let geojsonLayer;
        let labelLayerGroup = L.layerGroup().addTo(map);
        
        let rawGeoJsonData = null; // Bewaren we voor de export foto
        let seenDepartments = JSON.parse(localStorage.getItem('fr_seen_plates')) || [];

        // --- HULPFUNCTIES ---
        function isCodeSeen(code) {
            return seenDepartments.some(item => typeof item === 'string' ? item === code : item.code === code);
        }

        function getStyle(feature) {
            return {
                fillColor: isCodeSeen(feature.properties.code) ? '#2ecc71' : '#e0e0e0',
                weight: 1.2, opacity: 1, color: '#ffffff', fillOpacity: 0.85
            };
        }

        function updateStats() {
            if (!geojsonLayer) return;
            const total = geojsonLayer.getLayers().length;
            const seenCount = seenDepartments.length;
            const percentage = total > 0 ? Math.round((seenCount / total) * 100) : 0;
            document.getElementById('stats-text').innerText = `${seenCount} van de ${total} gezien (${percentage}%)`;
        }

        function toggleDepartment(code, layer) {
            const index = seenDepartments.findIndex(item => typeof item === 'string' ? item === code : item.code === code);
            if (index > -1) { seenDepartments.splice(index, 1); } 
            else { seenDepartments.push({ code: code, timestamp: new Date().toISOString() }); }
            localStorage.setItem('fr_seen_plates', JSON.stringify(seenDepartments));
            geojsonLayer.resetStyle(layer);
            updateStats();
        }

        // --- KAART OPBOUWEN ---
        function onEachFeature(feature, layer) {
            layer.bindTooltip(`<strong>${feature.properties.code}</strong> - ${feature.properties.nom}`, { sticky: true });
            layer.on({
                mouseover: function (e) { e.target.setStyle({ weight: 2.5, color: '#3498db', fillOpacity: 0.9 }); },
                mouseout: function (e) { geojsonLayer.resetStyle(e.target); },
                click: function (e) { toggleDepartment(feature.properties.code, e.target); }
            });

            const center = layer.getBounds().getCenter();
            const labelMarker = L.marker(center, {
                icon: L.divIcon({ className: 'dept-label', html: `<span>${feature.properties.code}</span>`, iconSize: [20, 20], iconAnchor: [10, 10] }),
                interactive: false
            });
            labelLayerGroup.addLayer(labelMarker);
        }

        if (window.innerWidth < 768) { map.setView([46.4, 2.3], 5.0); }

        fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
            .then(response => response.json())
            .then(data => {
                rawGeoJsonData = data;
                geojsonLayer = L.geoJSON(data, { style: getStyle, onEachFeature: onEachFeature }).addTo(map);
                updateStats();
            })
            .catch(error => console.error('Fout bij laden kaartgegevens:', error));

        // --- ZOEKFUNCTIE ---
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query || !geojsonLayer) return;
            let foundLayer = null;
            geojsonLayer.eachLayer(layer => {
                const code = layer.feature.properties.code.toLowerCase();
                const nom = layer.feature.properties.nom.toLowerCase();
                if (code === query || nom === query || nom.includes(query)) foundLayer = layer;
            });

            if (foundLayer) {
                map.fitBounds(foundLayer.getBounds(), { maxZoom: 7, padding: [20, 20] });
                foundLayer.setStyle({ color: '#e74c3c', weight: 3 });
                setTimeout(() => geojsonLayer.resetStyle(foundLayer), 2000);
            } else { alert('Departement niet gevonden.'); }
        }
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') performSearch(); });

        // --- EXPORT FOTO: DE SPOOK-KAART METHODE ---
        document.getElementById('shareBtn').addEventListener('click', () => {
            const shareBtn = document.getElementById('shareBtn');
            if (!rawGeoJsonData) {
                alert("De kaart is nog niet volledig geladen.");
                return;
            }

            shareBtn.innerText = "⏳ Genereren...";
            shareBtn.disabled = true;

            // STAP 1: Maak een verborgen container (800x800) helemaal achteraan in het scherm
            const exportDiv = document.createElement('div');
            exportDiv.style.position = 'fixed';
            exportDiv.style.top = '0';
            exportDiv.style.left = '0';
            exportDiv.style.width = '800px';
            exportDiv.style.height = '800px';
            exportDiv.style.zIndex = '-1000'; // Veilig verstopt achter je applicatie
            exportDiv.style.backgroundColor = '#f8f9fa';
            document.body.appendChild(exportDiv);

            // STAP 2: Maak hierin een tijdelijke Leaflet kaart aan die wél ingesteld is op de perfecte zoom
            const exportMap = L.map(exportDiv, {
                zoomControl: false, // Geen + en - knoppen op de foto!
                attributionControl: false,
                zoomSnap: 0.1,
                preferCanvas: true // Dwingt Leaflet om te tekenen als Canvas (lost de iOS bugs op)
            }).setView([46.4, 2.6], 6.0); // Perfect uitgezoomd voor een vlak van 800x800

            // STAP 3: Teken ALLEEN de gekleurde vlakken (dus GEEN zwevende nummers toevoegen)
            const exportLayer = L.geoJSON(rawGeoJsonData, {
                style: function(feature) {
                    return {
                        fillColor: isCodeSeen(feature.properties.code) ? '#2ecc71' : '#e0e0e0',
                        weight: 1.5, opacity: 1, color: '#ffffff', fillOpacity: 1
                    };
                }
            }).addTo(exportMap);

            // STAP 4: Wacht een halve seconde zodat Leaflet zijn tekening af heeft, maak dan de foto
            setTimeout(() => {
                html2canvas(exportDiv, {
                    useCORS: true,
                    scale: 1,
                    logging: false,
                    backgroundColor: '#f8f9fa'
                }).then(mapCanvas => {
                    
                    // STAP 5: Maak het definitieve doek (800x900) voor de foto inclusief banner
                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = 800;
                    finalCanvas.height = 900;
                    const ctx = finalCanvas.getContext('2d');

                    // Plak de kaart-foto op het doek
                    ctx.fillStyle = '#f8f9fa';
                    ctx.fillRect(0, 0, 800, 800);
                    ctx.drawImage(mapCanvas, 0, 0);

                    // STAP 6: De Truc! We berekenen de wiskundige positie van elk gebied en schilderen
                    // de nummers nu als harde 'inkt' over de tekening. Geen CSS bugs meer mogelijk.
                    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    exportLayer.eachLayer(layer => {
                        const code = layer.feature.properties.code;
                        const center = layer.getBounds().getCenter();
                        const point = exportMap.latLngToContainerPoint(center);

                        // Witte rand rondom het getal
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(code, point.x - 1.5, point.y);
                        ctx.fillText(code, point.x + 1.5, point.y);
                        ctx.fillText(code, point.x, point.y - 1.5);
                        ctx.fillText(code, point.x, point.y + 1.5);

                        // Donkere tekst
                        ctx.fillStyle = '#2c3e50';
                        ctx.fillText(code, point.x, point.y);
                    });

                    // Ruim de tijdelijke spoken-kaart direct op, we hebben hem niet meer nodig
                    exportMap.remove();
                    document.body.removeChild(exportDiv);

                    // STAP 7: Teken de statistieken banner eronder
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 800, 800, 100);
                    
                    ctx.strokeStyle = '#e9ecef';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(0, 800); ctx.lineTo(800, 800); ctx.stroke();

                    ctx.fillStyle = '#2c3e50';
                    ctx.font = 'bold 26px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('Frankrijk Kenteken Tracker', 40, 855);

                    const total = rawGeoJsonData.features.length;
                    const seenCount = seenDepartments.length;
                    const percentage = total > 0 ? Math.round((seenCount / total) * 100) : 0;

                    ctx.fillStyle = '#27ae60';
                    ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(`${seenCount} / ${total} Gezien (${percentage}%)`, 760, 855);

                    // STAP 8: Zet om naar PNG en start het delen
                    finalCanvas.toBlob(blob => {
                        const file = new File([blob], "mijn_kenteken_voortgang.png", { type: "image/png" });
                        
                        shareBtn.innerText = "📤 Deel Voortgang";
                        shareBtn.disabled = false;

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                files: [file],
                                title: 'Mijn Franse Kentekens',
                                text: 'Kijk hoe ver ik al ben met het spotten van Franse kentekens!'
                            }).catch(err => console.log("Delen geannuleerd"));
                        } else {
                            const link = document.createElement('a');
                            link.download = 'mijn_franse_kentekens.png';
                            link.href = finalCanvas.toDataURL();
                            link.click();
                            alert("Afbeelding opgeslagen in je Downloads! Voeg hem handmatig toe in WhatsApp.");
                        }
                    }, 'image/png');

                }).catch(err => {
                    exportMap.remove();
                    document.body.removeChild(exportDiv);
                    shareBtn.innerText = "📤 Deel Voortgang";
                    shareBtn.disabled = false;
                    alert("Er ging iets mis bij het genereren.");
                });
            }, 500);
        });

        // --- EXPORT / IMPORT / RESET ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(seenDepartments, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            const dateString = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("download", `kenteken_logboek_${dateString}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());

        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (Array.isArray(importedData)) {
                        seenDepartments = importedData;
                        localStorage.setItem('fr_seen_plates', JSON.stringify(seenDepartments));
                        geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
                        updateStats();
                        alert('Logboek succesvol geladen!');
                    } else { alert('Fout: Onjuist bestandsformaat.'); }
                } catch (err) { alert('Fout bij inlezen.'); }
            };
            reader.readAsText(file);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Weet je zeker dat je alle voortgang wilt wissen?')) {
                seenDepartments = [];
                localStorage.removeItem('fr_seen_plates');
                geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
                updateStats();
            }
        });
    </script>
</body>
</html>
